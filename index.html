<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  
  <!-- === 將網頁加入手機桌面捷徑 (Web App) 專用設定 === -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="二苓課表">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fffdfa">
  
  <!-- 桌面捷徑的專屬 APP 圖示 (指向實體圖片檔案) -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon.jpg">
  <link rel="icon" type="image/jpeg" sizes="192x192" href="icon.jpg">
  <link rel="icon" type="image/jpeg" href="icon.jpg">

  <title>高雄市小港區二苓國小115學年度課表</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 升級為繁體中文專屬的手寫風字體 LXGW WenKai TC，確保名字絕不缺字、粗細統一 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* 全域套用可愛字體與背景 */
    body {
      font-family: 'LXGW WenKai TC', cursive, "微軟正黑體", sans-serif;
      background-color: #fffdfa;
      color: #4a4a4a;
      margin: 0;
      padding: 6px;
      -webkit-tap-highlight-color: transparent; /* 消除手機點擊後的反灰/反藍殘影 */
    }

    .app-container {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
      padding: 4px;
    }

    /* 課表表格樣式 (固定版面，防止手機溢出) */
    table {
      width: 100%;
      table-layout: fixed; /* 鎖定表格寬度，字再多都會擠在裡面，防止跑版 */
      border-collapse: separate;
      border-spacing: 3px; /* 微調加大間距，避免手機版像素運算吃掉虛線 */
      margin-top: 10px;
    }

    /* 電腦版：加大格子間距 */
    @media (min-width: 768px) {
      table { border-spacing: 5px; margin-top: 15px; }
      body { padding: 15px; }
    }

    th {
      background-color: #ffd8b1;
      color: #6d4c41;
      font-weight: 600;
      padding: 6px 2px;
      border-radius: 8px;
      font-size: 0.9rem;
      overflow: hidden;
      white-space: nowrap;
      box-sizing: border-box; /* 確保內外距計算正確 */
    }

    td {
      background-color: #fff9f2;
      border: 2px dashed #f0d5b6; /* 修正：將 1.5px 改為 2px，避免手機螢幕計算小數點時把垂直虛線吃掉 */
      box-sizing: border-box; /* 修正：確保邊框厚度被包含在格子寬度內，不會被擠出去 */
      text-align: center;
      padding: 4px 1px;
      border-radius: 8px;
      height: 60px; /* 手機版：合適高度 */
      vertical-align: middle;
      color: #5c4033;
      overflow: hidden; /* 防止內容撐開格子 */
    }

    /* 新增：當切換到資源班時，稍微縮小格子高度，保證早自習加進去後總高度不變，免滑動！ */
    .resource-table td {
      height: 52px;
    }

    /* 新增：李介麟老師專用（含早自習與第八節），高度再次微調防溢出 */
    .resource-extended-table td {
      height: 47px;
    }

    /* 電腦版：放大表頭與格子高度 */
    @media (min-width: 768px) {
      th { font-size: 1.3rem; padding: 12px 6px; border-radius: 12px; }
      td { height: 95px; padding: 8px 4px; border-radius: 12px; }
    }

    .time-col {
      background-color: #dcedc8;
      border: none;
      color: #33691e;
      line-height: 1.2;
    }

    .lunch-break {
      background-color: #b3e5fc;
      border: none;
      color: #01579b;
      letter-spacing: 3px;
      font-size: 1rem;
    }

    @media (min-width: 768px) {
      .lunch-break { letter-spacing: 5px; font-size: 1.5rem; }
    }

    /* 左上角斜線表頭 (星期/時間) */
    .diagonal-split {
      position: relative;
      background-image: linear-gradient(to bottom left, transparent calc(50% - 1px), #dcae80 calc(50% - 1px), #dcae80 calc(50% + 1px), transparent calc(50% + 1px));
    }
    .diagonal-split .top-right {
      position: absolute;
      top: 2px;
      right: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .diagonal-split .bottom-left {
      position: absolute;
      bottom: 2px;
      left: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    @media (min-width: 768px) {
      .diagonal-split .top-right { font-size: 1.1rem; top: 6px; right: 10px; }
      .diagonal-split .bottom-left { font-size: 1.1rem; bottom: 6px; left: 10px; }
    }

    /* 下拉選單自訂箭頭 */
    select {
      font-family: 'LXGW WenKai TC', cursive, "微軟正黑體", sans-serif;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236d4c41' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3C/polyline%3e%3C/svg%3e");
      background-repeat: no-repeat;
      background-position: right 4px center;
      background-size: 1em;
    }

    @media print {
      body { background: white; }
      .no-print { display: none !important; }
      td { border: 1px solid #d3d3d3; background-color: transparent !important; }
    }
  </style>

    // 新增：自動計算並抓取該班級授課節數最多的老師（即導師）
    function getHomeroomTeacher(className) {
      const schedule = classSchedules[className];
      if (!schedule) return '';
      
      const teacherCounts = {};
      let maxCount = 0;
      let homeroomTeacher = '';

      for (const day in schedule) {
        schedule[day].forEach(slot => {
          // 確保老師欄位有名字，且不是空白
          if (slot.t && slot.t.trim() !== '') {
            teacherCounts[slot.t] = (teacherCounts[slot.t] || 0) + 1;
            // 找出出現最多次的名字
            if (teacherCounts[slot.t] > maxCount) {
              maxCount = teacherCounts[slot.t];
              homeroomTeacher = slot.t;
            }
          }
        });
      }
      return homeroomTeacher;
    }

        const hrTeacher = getHomeroomTeacher(currentClass);
        // 移除藍色字體與底線，恢復預設外觀，隱藏式保留點擊開關 (onclick)

        if (rawValue.includes('-')) {

        const found = subjectTeachers[dept].find(t => {

      }
      return null;

      const isTeacherView = roleSelect.value === '科任';
      
      // 取出導師姓名 (用來判斷聚焦模式)
      const hrTeacher = getHomeroomTeacher(currentClass);

      // 取出科任老師的純姓名 (用來比對資料庫)

      if (currentTeacher && currentTeacher.includes('-')) {
        currentTeacher = currentTeacher.split('-')[1];
      }

      // 判斷是否為資源班：如果是，幫表格套用縮小高度的專屬設計
      const isResource = isTeacherView && deptSelect.value === '資源班';
      const tableEl = document.querySelector('table');
      if (isResource) {
        if (currentTeacher === '李介麟') {
          tableEl.classList.add('resource-extended-table');
          tableEl.classList.remove('resource-table');
        } else {
          tableEl.classList.add('resource-table');
          tableEl.classList.remove('resource-extended-table');
        }
      } else {
        tableEl.classList.remove('resource-table');
        tableEl.classList.remove('resource-extended-table');
      }

      // 動態產生這張課表要顯示的節次 (資源班專屬早自習，時間暫設 07:50-08:30)
      let activeTimeSlots = [...timeSlots];
      if (isResource) {
        activeTimeSlots.unshift({ name: '早自習', time: '07:50-08:30', isBreak: false, origIndex: -1 });
        // 新增：只有李介麟老師專屬的第八節
        if (currentTeacher === '李介麟') {
          activeTimeSlots.push({ name: '第八節', time: '16:05-16:45', isBreak: false, origIndex: 8 });
        }
      }

      activeTimeSlots.forEach((slot) => {
        html += `<tr>`;
        // 第一欄：節次與時間 (字體同步微調放大)
        let timeFormatted = slot.time.replace('-', '<br>');
        html += `<td class="time-col">
                   <div class="font-bold text-[13px] md:text-2xl">${slot.name}</div>
                   <div class="text-[10px] md:text-base text-gray-600 mt-1 leading-tight">${timeFormatted}</div>
                 </td>`;
        
        // 午休
        if (slot.isBreak) {
          html += `<td colspan="5" class="lunch-break font-bold">午 🍽️ 餐 😴 午 💤 休</td>`;
        } else {
          // 星期一到星期五
          for (let i = 0; i < 5; i++) {
            let dayKey = days[i];
            let cellData = { subject: '', teacher: '' };

            if (isResource) {
              // 【資源班專屬】：直接讀取 resourceSchedules 的資料 (包含 -1 早自習)
              if (resourceSchedules[currentTeacher] && resourceSchedules[currentTeacher][dayKey] && resourceSchedules[currentTeacher][dayKey][slot.origIndex]) {
                const item = resourceSchedules[currentTeacher][dayKey][slot.origIndex];
                cellData = { subject: item.s, teacher: item.t || '' };
              }
            } else {
              // 【常態班級與一般科任】：排除早自習 (-1)，只抓常態節次 (0~7)
              if (slot.origIndex >= 0) {
                if (!isTeacherView) {
                  // 【導師視角】：直接顯示該班級的科目與授課老師
                  if (classSchedules[currentClass] && classSchedules[currentClass][dayKey] && classSchedules[currentClass][dayKey][slot.origIndex]) {

                    cellData = { subject: item.s, teacher: item.t || '' };
                  }
                } else {
                  // 【科任視角】：掃描全校資料庫，找出該老師在哪個班級上課
                  for (const [className, schedule] of Object.entries(classSchedules)) {
                    if (schedule[dayKey] && schedule[dayKey][slot.origIndex]) {
                      const item = schedule[dayKey][slot.origIndex];
                      // 如果這節課是這個老師上的
                      if (item.t === currentTeacher) {

              let teacherHtml = '';
              if (!isTeacherView) {
                // 導師視角：點擊跳轉到該科任老師
                teacherHtml = `<div onclick="goToTeacher('${cellData.teacher}')" class="text-[12px] min-[400px]:text-[13px] md:text-[20px] text-gray-500 font-semibold whitespace-nowrap overflow-hidden text-ellipsis mt-0.5 cursor-pointer rounded mx-1">${cellData.teacher}</div>`;
              } else {
                // 科任視角：點擊跳轉到該班級
                teacherHtml = `<div onclick="goToClass('${cellData.teacher}')" class="text-[12px] min-[400px]:text-[13px] md:text-[20px] text-gray-500 font-semibold whitespace-nowrap overflow-hidden text-ellipsis mt-0.5 cursor-pointer rounded mx-1">${cellData.teacher}</div>`;
              }

              html += `<td class="${fadeClass}">
                         <div class="text-[15px] min-[400px]:text-[16px] md:text-[26px] font-bold text-gray-800 whitespace-nowrap overflow-hidden text-ellipsis">${cellData.subject}</div>
                         ${teacherHtml}
                       </td>`;
            } else {
              // 沒課的空格也一併加上淡化類別，這樣網格才會一致消失
              let emptyFadeClass = isFocusMode ? 'opacity-10 transition-opacity duration-500' : 'transition-opacity duration-500';
              html += `<td class="${emptyFadeClass}"></td>`;
            }
          }
        }
        html += `</tr>`;
      });
      scheduleBody.innerHTML = html;
    }

    // 事件監聽綁定
    roleSelect.addEventListener('change', (e) => {
      isFocusMode = false; // 切換身分時，強制關閉聚焦模式
      if (e.target.value === '導師') {
        classSelectWrapper.classList.remove('hidden');
        deptSelectWrapper.classList.add('hidden');
        teacherSelectWrapper.classList.add('hidden');
      } else {
        classSelectWrapper.classList.add('hidden');
        deptSelectWrapper.classList.remove('hidden');
        teacherSelectWrapper.classList.remove('hidden');
        updateTeacherOptions(); // 切換時自動更新老師名單
      }
      updateTitle();
    });

    classSelect.addEventListener('change', () => {
      isFocusMode = false; // 切換班級時，強制關閉聚焦模式
      updateTitle();
    });
    
    deptSelect.addEventListener('change', () => {
      isFocusMode = false; // 切換處室時，強制關閉聚焦模式
      updateTeacherOptions();
      updateTitle();
    });
    
    teacherSelect.addEventListener('change', () => {
      isFocusMode = false; // 切換老師時，強制關閉聚焦模式
      updateTitle();
    });

    // 系統初始化函數：負責把班級與老師名單塞進選單，並畫出第一張課表
    function initDropdowns() {
      // 1. 動態生成班級下拉選單
      classSelect.innerHTML = classOptions.map(cls => `<option value="${cls}">${cls}</option>`).join('');
      
      // 2. 動態生成預設處室的老師選單
      updateTeacherOptions();
      
      // 3. 更新標題並畫出第一張課表 (這會觸發 renderSchedule)
      updateTitle();
    }

    // 正式啟動系統
    initDropdowns();
  </script>
</body>
</html>
