<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="二苓課表">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fffdfa">
  
  <!-- 桌面捷徑的專屬 APP 圖示 (指向實體圖片檔案) -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon.jpg">
  <link rel="icon" type="image/jpeg" sizes="192x192" href="icon.jpg">
  <link rel="icon" type="image/jpeg" href="icon.jpg">

  <title>高雄市小港區二苓國小115學年度課表</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 升級為繁體中文專屬的手寫風字體 LXGW WenKai TC，確保名字絕不缺字、粗細統一 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* 全域套用可愛字體與背景 */
    body {
      font-family: 'LXGW WenKai TC', cursive, "微軟正黑體", sans-serif;
      background-color: #fffdfa;
      color: #4a4a4a;
      margin: 0;
      padding: 6px;
    }

    .app-container {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
      padding: 4px;
    }

    /* 課表表格樣式 (固定版面，防止手機溢出) */
    table {
      width: 100%;
      table-layout: fixed; /* 鎖定表格寬度，字再多都會擠在裡面，防止跑版 */
      border-collapse: separate;
      border-spacing: 3px; /* 微調加大間距，避免手機版像素運算吃掉虛線 */
      margin-top: 10px;
    }

    /* 電腦版：加大格子間距 */
    @media (min-width: 768px) {
      table { border-spacing: 5px; margin-top: 15px; }
      body { padding: 15px; }
    }

    th {
      background-color: #ffd8b1;
      color: #6d4c41;
      font-weight: 600;
      padding: 6px 2px;
      border-radius: 8px;
      font-size: 0.9rem;
      overflow: hidden;
      white-space: nowrap;
      box-sizing: border-box; /* 確保內外距計算正確 */
    }

    td {
      background-color: #fff9f2;
      border: 2px dashed #f0d5b6; /* 修正：將 1.5px 改為 2px，避免手機螢幕計算小數點時把垂直虛線吃掉 */
      box-sizing: border-box; /* 修正：確保邊框厚度被包含在格子寬度內，不會被擠出去 */
      text-align: center;
      padding: 4px 1px;
      border-radius: 8px;
      height: 60px; /* 手機版：合適高度 */
      vertical-align: middle;
      color: #5c4033;
      overflow: hidden; /* 防止內容撐開格子 */
    }

    /* 電腦版：放大表頭與格子高度 */
    @media (min-width: 768px) {
      th { font-size: 1.3rem; padding: 12px 6px; border-radius: 12px; }
      td { height: 95px; padding: 8px 4px; border-radius: 12px; }
    }

    .time-col {
      background-color: #dcedc8;
      border: none;
      color: #33691e;
      line-height: 1.2;
    }

    .lunch-break {
      background-color: #b3e5fc;
      border: none;
      color: #01579b;
      letter-spacing: 3px;
      font-size: 1rem;
    }

    @media (min-width: 768px) {
      .lunch-break { letter-spacing: 5px; font-size: 1.5rem; }
    }

    /* 左上角斜線表頭 (星期/時間) */
    .diagonal-split {
      position: relative;
      background-image: linear-gradient(to bottom left, transparent calc(50% - 1px), #dcae80 calc(50% - 1px), #dcae80 calc(50% + 1px), transparent calc(50% + 1px));
    }
    .diagonal-split .top-right {
      position: absolute;
      top: 2px;
      right: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .diagonal-split .bottom-left {
      position: absolute;
      bottom: 2px;
      left: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    @media (min-width: 768px) {
      .diagonal-split .top-right { font-size: 1.1rem; top: 6px; right: 10px; }
      .diagonal-split .bottom-left { font-size: 1.1rem; bottom: 6px; left: 10px; }
    }

    /* 下拉選單自訂箭頭 */
    select {
      font-family: 'LXGW WenKai TC', cursive, "微軟正黑體", sans-serif;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236d4c41' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3C/polyline%3e%3C/svg%3e");
      background-repeat: no-repeat;
      background-position: right 4px center;
      background-size: 1em;
    }

    @media print {
      body { background: white; }
      .no-print { display: none !important; }
      td { border: 1px solid #d3d3d3; background-color: transparent !important; }
    }
  </style>
</head>

        'MON': [ { s: '彈英', t: '盧岱岑' }, { s: '國語', t: '王智琴' }, { s: '數學', t: '王智琴' }, { s: '彈性', t: '王智琴' }, { s: '午休' }, { s: '', t: '' }, { s: '', t: '' }, { s: '', t: '' } ],
        'TUE': [ { s: '生活', t: '王智琴' }, { s: '體育', t: '沈金池' }, { s: '國語', t: '王智琴' }, { s: '國語', t: '王智琴' }, { s: '午休' }, { s: '生活', t: '施雅芸' }, { s: '生活', t: '施雅芸' }, { s: '彈性', t: '王智琴' } ],
        'WED': [ { s: '國語', t: '王智琴' }, { s: '健康', t: '邱子芸' }, { s: '生活', t: '施雅芸' }, { s: '數學', t: '王智琴' }, { s: '午休' }, { s: '', t: '' }, { s: '', t: '' }, { s: '', t: '' } ],
        'THU': [ { s: '土本語', t: '葉玟孝' }, { s: '生活', t: '施雅芸' }, { s: '數學', t: '王智琴' }, { s: '國語', t: '王智琴' }, { s: '午休' }, { s: '', t: '' }, { s: '', t: '' }, { s: '', t: '' } ],
        'FRI': [ { s: '國語', t: '王智琴' }, { s: '體育', t: '沈金池' }, { s: '生活', t: '王智琴' }, { s: '數學', t: '王智琴' }, { s: '午休' }, { s: '', t: '' }, { s: '', t: '' }, { s: '', t: '' } ]
      }
    };

    // DOM 元素綁定
    const roleSelect = document.getElementById('roleSelect');
    const classSelectWrapper = document.getElementById('classSelectWrapper');
    const classSelect = document.getElementById('classSelect');
    const deptSelectWrapper = document.getElementById('deptSelectWrapper');
    const deptSelect = document.getElementById('deptSelect');
    const teacherSelectWrapper = document.getElementById('teacherSelectWrapper');
    const teacherSelect = document.getElementById('teacherSelect');
    const scheduleTitle = document.getElementById('scheduleTitle');
    const scheduleBody = document.getElementById('scheduleBody');

    // 【最關鍵的啟動函數】在這裡定義，剛剛就是不小心把這塊弄丟了
    function initDropdowns() {
      // 填入班級選單
      classSelect.innerHTML = classOptions.map(c => `<option value="${c}">${c}</option>`).join('');
      // 初始化科任教師選單
      updateTeacherOptions();
      // 繪製初始畫面
      updateTitle();
    }

    // 更新科任教師選單
    function updateTeacherOptions() {
      const dept = deptSelect.value;
      const teachers = subjectTeachers[dept] || [];
      teacherSelect.innerHTML = teachers.map(t => `<option value="${t}">${t}</option>`).join('');
    }

    // 更新課表標題 (包含主任/老師的聰明判斷)
    function updateTitle() {
      if (roleSelect.value === '導師') {
        scheduleTitle.textContent = classSelect.value;
      } else {
        // 科任標題處理邏輯
        const rawValue = teacherSelect.value;
        if (!rawValue) return; // 避免找不到值報錯
        
        let name = rawValue;
        let suffix = ' 老師'; // 預設稱呼為老師

        // 如果字串包含 '-'，代表是「職稱-姓名」格式，將其切割並只取姓名
        if (rawValue.includes('-')) {
          name = rawValue.split('-')[1];
        }

        // 如果原本字串包含「主任」，就把稱呼改成主任
        if (rawValue.includes('主任')) {
          suffix = ' 主任';
        }

        scheduleTitle.textContent = name + suffix;
      }
      renderSchedule();
    }

    // 繪製課表
    function renderSchedule() {
      let html = '';
      const days = ['MON', 'TUE', 'WED', 'THU', 'FRI'];
      const isGrade1Class1 = (roleSelect.value === '導師' && classSelect.value === '一年1班');

      timeSlots.forEach((slot, slotIndex) => {
        html += `<tr>`;
        // 第一欄：節次與時間
        let timeFormatted = slot.time.replace('-', '<br>');
        html += `<td class="time-col">
                   <div class="font-bold text-[11px] md:text-xl">${slot.name}</div>
                   <div class="text-[9px] md:text-sm text-gray-600 mt-1 leading-tight">${timeFormatted}</div>
                 </td>`;
        
        // 午休
        if (slot.isBreak) {
          html += `<td colspan="5" class="lunch-break font-bold">午 🍽️ 餐 😴 午 💤 休</td>`;
        } else {
          // 星期一到星期五
          for (let i = 0; i < 5; i++) {
            let dayKey = days[i];
            let cellData = { subject: '', teacher: '' };

            if (isGrade1Class1 && grade1Class1Schedule[dayKey] && grade1Class1Schedule[dayKey][slotIndex]) {
              cellData = grade1Class1Schedule[dayKey][slotIndex];
            }

            if (cellData.subject) {
              // 強制單行、超出隱藏，保持表格完美比例
              html += `<td>
                         <div class="text-[13px] md:text-2xl font-bold text-gray-800 whitespace-nowrap overflow-hidden text-ellipsis">${cellData.subject}</div>
                         <div class="text-[9px] md:text-lg text-gray-500 whitespace-nowrap overflow-hidden text-ellipsis mt-0.5">${cellData.teacher}</div>
                       </td>`;
            } else {
              html += `<td></td>`;
            }
          }
        }
        html += `</tr>`;
      });
      scheduleBody.innerHTML = html;
    }

    // 事件監聽綁定
    roleSelect.addEventListener('change', (e) => {
      if (e.target.value === '導師') {
        classSelectWrapper.classList.remove('hidden');
        deptSelectWrapper.classList.add('hidden');
        teacherSelectWrapper.classList.add('hidden');
      } else {
        classSelectWrapper.classList.add('hidden');
        deptSelectWrapper.classList.remove('hidden');
        teacherSelectWrapper.classList.remove('hidden');
        updateTeacherOptions(); // 切換時自動更新老師名單
      }
      updateTitle();
    });

    classSelect.addEventListener('change', updateTitle);
    
    deptSelect.addEventListener('change', () => {
      updateTeacherOptions();
      updateTitle();
    });
    
    teacherSelect.addEventListener('change', updateTitle);

    // 正式啟動系統
    initDropdowns();
  </script>
</body>
</html>
