<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  
  <!-- === 將網頁加入手機桌面捷徑 (Web App) 專用設定 === -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="二苓課表">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fffdfa">
  
  <!-- 桌面捷徑的專屬 APP 圖示 (指向實體圖片檔案) -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon.jpg">
  <link rel="icon" type="image/jpeg" sizes="192x192" href="icon.jpg">
  <link rel="icon" type="image/jpeg" href="icon.jpg">

  <title>高雄市小港區二苓國小115學年度課表</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 升級為繁體中文專屬的手寫風字體 LXGW WenKai TC，確保名字絕不缺字、粗細統一 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* 全域套用可愛字體與背景 */
    body {
      font-family: 'LXGW WenKai TC', cursive, "微軟正黑體", sans-serif;
      background-color: #fffdfa;
      color: #4a4a4a;
      margin: 0;
      padding: 6px;
      -webkit-tap-highlight-color: transparent; /* 消除手機點擊後的反灰/反藍殘影 */
    }

    .app-container {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
      padding: 4px;
    }

    /* 課表表格樣式 (固定版面，防止手機溢出) */
    table {
      width: 100%;
      table-layout: fixed; /* 鎖定表格寬度，字再多都會擠在裡面，防止跑版 */
      border-collapse: separate;
      border-spacing: 3px; /* 微調加大間距，避免手機版像素運算吃掉虛線 */
      margin-top: 10px;
    }

    /* 電腦版：加大格子間距 */
    @media (min-width: 768px) {
      table { border-spacing: 5px; margin-top: 15px; }
      body { padding: 15px; }
    }

    th {
      background-color: #ffd8b1;
      color: #6d4c41;
      font-weight: 600;
      padding: 6px 2px;
      border-radius: 8px;
      font-size: 0.9rem;
      overflow: hidden;
      white-space: nowrap;
      box-sizing: border-box; /* 確保內外距計算正確 */
    }

    td {
      background-color: #fff9f2;
      border: 2px dashed #f0d5b6; /* 修正：將 1.5px 改為 2px，避免手機螢幕計算小數點時把垂直虛線吃掉 */
      box-sizing: border-box; /* 修正：確保邊框厚度被包含在格子寬度內，不會被擠出去 */
      text-align: center;
      padding: 4px 1px;
      border-radius: 8px;
      height: 60px; /* 手機版：合適高度 */
      vertical-align: middle;
      color: #5c4033;
      overflow: hidden; /* 防止內容撐開格子 */
    }

    /* 當切換到資源班時，稍微縮小格子高度，保證早自習加進去後總高度不變，免滑動！ */
    .resource-table td {
      height: 52px;
    }

    /* 李介麟老師專用（含早自習與第八節），高度再次微調防溢出 */
    .resource-extended-table td {
      height: 47px;
    }

    /* 電腦版：放大表頭與格子高度 */
    @media (min-width: 768px) {
      th { font-size: 1.3rem; padding: 12px 6px; border-radius: 12px; }
      td { height: 95px; padding: 8px 4px; border-radius: 12px; }
    }

    .time-col {
      background-color: #dcedc8;
      border: none;
      color: #33691e;
      line-height: 1.2;
    }

    .lunch-break {
      background-color: #b3e5fc;
      border: none;
      color: #01579b;
      letter-spacing: 3px;
      font-size: 1rem;
    }

    @media (min-width: 768px) {
      .lunch-break { letter-spacing: 5px; font-size: 1.5rem; }
    }

    /* 左上角斜線表頭 (星期/時間) */
    .diagonal-split {
      position: relative;
      background-image: linear-gradient(to bottom left, transparent calc(50% - 1px), #dcae80 calc(50% - 1px), #dcae80 calc(50% + 1px), transparent calc(50% + 1px));
    }
    .diagonal-split .top-right {
      position: absolute;
      top: 2px;
      right: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .diagonal-split .bottom-left {
      position: absolute;
      bottom: 2px;
      left: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    @media (min-width: 768px) {
      .diagonal-split .top-right { font-size: 1.1rem; top: 6px; right: 10px; }
      .diagonal-split .bottom-left { font-size: 1.1rem; bottom: 6px; left: 10px; }
    }

    /* 下拉選單自訂箭頭 */
    select {
      font-family: 'LXGW WenKai TC', cursive, "微軟正黑體", sans-serif;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236d4c41' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3C/polyline%3e%3C/svg%3e");
      background-repeat: no-repeat;
      background-position: right 4px center;
      background-size: 1em;
    }

    @media print {
      body { background: white; }
      .no-print { display: none !important; }
      td { border: 1px solid #d3d3d3; background-color: transparent !important; }
    }
  </style>
</head>
<body>

  <div id="lockOverlay" class="fixed inset-0 bg-[#fffdfa] z-50 flex flex-col items-center justify-center transition-opacity duration-500">
    <div class="text-gray-400 font-bold tracking-widest text-lg">系統連線中...</div>
    
    <!-- 隱藏在右下角的秘密觸發區塊 -->
    <div class="absolute bottom-0 right-0 w-24 h-24 cursor-pointer" onclick="showLoginBox()"></div>
    
    <!-- 密碼輸入框 (預設隱藏) -->
    <div id="loginBox" class="hidden mt-8 flex flex-col items-center gap-3 bg-white p-6 rounded-2xl shadow-lg border border-gray-100">
      <p class="text-gray-600 font-bold text-sm">請輸入通行碼</p>
      <input type="password" id="passcodeInput" class="w-32 px-3 py-2 border-2 border-gray-200 rounded-lg text-center text-lg focus:outline-none focus:border-orange-300" placeholder="•••••••">
      <button onclick="checkPasscode()" class="bg-[#ffd8b1] text-[#6d4c41] font-bold px-6 py-2 rounded-lg shadow hover:bg-orange-300 transition-colors">解鎖</button>
      <p id="errorMsg" class="hidden text-red-500 text-xs font-bold mt-1">密碼錯誤，請重試</p>
    </div>
  </div>

  <!-- === 新增：校園地圖彈出視窗 (輪播模式) === -->
  <div id="mapModal" class="fixed inset-0 bg-black/90 z-[100] hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300">
    <!-- 圖片容器 (解開寬度封印，最大化 95% 寬高) -->
    <div class="relative w-[95vw] h-[95vh] flex flex-col items-center justify-center">
      <!-- 關閉按鈕 (固定於右上角) -->
      <button onclick="hideMap()" class="absolute top-0 right-0 md:top-2 md:right-2 text-white hover:text-gray-300 focus:outline-none bg-black/40 rounded-full p-2 z-[110] backdrop-blur-sm">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8 md:w-10 md:h-10">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      
      <!-- ⬅️ 向左箭頭 -->
      <button onclick="prevMap(event)" class="absolute left-0 top-1/2 -translate-y-1/2 text-white hover:text-gray-300 focus:outline-none bg-black/40 rounded-full p-2 z-[110] backdrop-blur-sm ml-2 md:ml-4">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-8 h-8 md:w-10 md:h-10">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
        </svg>
      </button>

      <!-- 圖片本體 (預設顯示 map1.png) -->
      <img id="mapImage" src="map1.png" alt="校園資訊圖" class="w-full h-full object-contain rounded-xl shadow-2xl bg-[#fffdfa]" onerror="this.onerror=null; this.src='https://placehold.co/800x600/eeeeee/999999?text=尚未上傳+map' + currentMapIndex + '.png';">

      <!-- ➡️ 向右箭頭 -->
      <button onclick="nextMap(event)" class="absolute right-0 top-1/2 -translate-y-1/2 text-white hover:text-gray-300 focus:outline-none bg-black/40 rounded-full p-2 z-[110] backdrop-blur-sm mr-2 md:mr-4">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-8 h-8 md:w-10 md:h-10">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
        </svg>
      </button>

      <!-- 頁碼顯示器 (例如 1 / 3) -->
      <div class="absolute bottom-2 md:bottom-4 bg-black/60 text-white font-bold px-4 py-1.5 rounded-full text-sm md:text-lg tracking-widest z-[110] backdrop-blur-sm">
        <span id="mapPageNumber">1</span> / 3
      </div>
    </div>
  </div>

  <!-- === 新增：群組選擇彈出視窗 (超級過濾器) === -->
  <div id="groupModal" class="fixed inset-0 bg-black/80 z-[100] hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300">
    <div class="bg-white w-[90vw] max-w-lg rounded-2xl shadow-2xl p-4 md:p-6 flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg md:text-2xl font-bold text-gray-800">🤝 挑選比對老師 (最多4位)</h3>
        <button onclick="hideGroupModal()" class="text-gray-500 hover:text-red-500">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-8 md:w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </div>
      <div class="text-sm text-gray-500 mb-2 font-bold">請勾選要比對空堂的老師：</div>
      <div id="groupTeacherList" class="flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 gap-2 md:gap-3 p-1">
        <!-- JS 動態產生勾選清單 -->
      </div>
      <div class="mt-4 flex justify-between items-center border-t pt-4">
        <span id="groupCountText" class="font-bold text-pink-600 tracking-widest text-lg">已選: 0/4</span>
        <button onclick="confirmGroupSelection()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-6 rounded-lg transition-colors">確定比較</button>
      </div>
    </div>
  </div>

  <div class="app-container">
    
    <!-- 最上方大標題 -->
    <div class="text-center mb-3 md:mb-5">
      <h2 class="font-bold text-gray-700 whitespace-nowrap" style="font-size: clamp(16px, 5.3vw, 42px);">
        高雄市小港區二苓國小115學年度課表
      </h2>
    </div>

    <!-- 控制面板 -->
    <div class="no-print flex flex-row flex-wrap gap-2 md:gap-4 items-end justify-center mb-3">
      
      <!-- 身份選擇 (新增群組選項) -->
      <div class="flex flex-col gap-1">
        <label class="text-[10px] md:text-sm font-semibold text-gray-600 pl-1">身份</label>
        <select id="roleSelect" class="w-auto pl-2 pr-5 py-1 bg-orange-50 border-2 border-orange-200 rounded-lg text-orange-900 focus:outline-none text-xs md:text-lg font-bold">
          <option value="導師">導師</option>
          <option value="科任">科任</option>
          <option value="群組">群組</option>
        </select>
      </div>

      <!-- 導師：班級選擇 -->
      <div id="classSelectWrapper" class="flex flex-col gap-1">
        <label class="text-[10px] md:text-sm font-semibold text-gray-600 pl-1">班級</label>
        <select id="classSelect" class="w-auto pl-2 pr-5 py-1 bg-green-50 border-2 border-green-200 rounded-lg text-green-900 focus:outline-none text-xs md:text-lg font-bold">
          <!-- JS 動態生成 -->
        </select>
      </div>

      <!-- 科任：處室選擇 -->
      <div id="deptSelectWrapper" class="flex flex-col gap-1 hidden">
        <label class="text-[10px] md:text-sm font-semibold text-gray-600 pl-1">處室</label>
        <select id="deptSelect" class="w-auto pl-2 pr-5 py-1 bg-blue-50 border-2 border-blue-200 rounded-lg text-blue-900 focus:outline-none text-xs md:text-lg font-bold">
          <option value="教務處">教務處</option>
          <option value="學務處">學務處</option>
          <option value="總務處">總務處</option>
          <option value="輔導室">輔導室</option>
          <option value="資源班">資源班</option>
          <option value="純科任">純科任</option>
          <option value="🏀 體育課總表">🏀 體育課總表</option>
        </select>
      </div>

      <!-- 科任：教師選擇 -->
      <div id="teacherSelectWrapper" class="flex flex-col gap-1 hidden">
        <label class="text-[10px] md:text-sm font-semibold text-gray-600 pl-1">名字</label>
        <select id="teacherSelect" class="w-auto pl-2 pr-5 py-1 bg-purple-50 border-2 border-purple-200 rounded-lg text-purple-900 focus:outline-none text-xs md:text-lg font-bold">
          <!-- JS 動態生成 -->
        </select>
      </div>

      <!-- === 新增：群組挑選按鈕 (預設隱藏) === -->
      <div id="groupSelectWrapper" class="flex flex-col gap-1 hidden">
        <label class="text-[10px] md:text-sm font-semibold text-gray-600 pl-1">挑選名單</label>
        <button id="groupSelectBtn" onclick="showGroupModal()" class="w-auto px-3 py-1 bg-pink-50 border-2 border-pink-200 rounded-lg text-pink-900 font-bold text-xs md:text-lg hover:bg-pink-100 transition-colors">➕ 挑選老師 (0/4)</button>
      </div>

      <!-- 地圖按鈕 (彩色 🗺️ 圖示) -->
      <div class="flex flex-col gap-1 pb-[2px] md:pb-[3px]">
        <button onclick="showMap()" class="w-[28px] h-[28px] md:w-[38px] md:h-[38px] bg-white border-2 border-gray-200 rounded-lg flex items-center justify-center shadow-sm hover:bg-gray-50 hover:border-gray-300 transition-colors focus:outline-none text-sm md:text-2xl" title="查看校園地圖">
          🗺️
        </button>
      </div>

    </div>

    <!-- 中間大標題 -->
    <div class="text-center mb-2 md:mb-4 relative w-full flex items-center justify-center">
      <h1 id="scheduleTitle" class="text-2xl md:text-4xl font-bold text-gray-800 tracking-wider w-full">一年1班</h1>
      <div id="extNumber" class="absolute right-0 top-1/2 -translate-y-1/2 text-[10px] min-[375px]:text-[11px] md:text-[15px] font-bold text-gray-600 pr-1 leading-tight"></div>
    </div>

    <!-- 課表表格 -->
    <div>
      <table>
        <thead>
          <tr>
            <th class="diagonal-split" style="width: 16%;">
              <span class="top-right">星期</span>
              <span class="bottom-left">時間</span>
            </th>
            <th>星期一</th>
            <th>星期二</th>
            <th>星期三</th>
            <th>星期四</th>
            <th>星期五</th>
          </tr>
        </thead>
        <tbody id="scheduleBody">
          <!-- 課表內容由 JS 動態生成 -->
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // ==========================================
    // 隱藏鎖定邏輯與本地記憶設定
    // ==========================================
    const PASSCODE = '8016837';
    const lockOverlay = document.getElementById('lockOverlay');
    const loginBox = document.getElementById('loginBox');
    const passcodeInput = document.getElementById('passcodeInput');
    const errorMsg = document.getElementById('errorMsg');
    
    // 全域變數宣告
    let isFocusMode = false;
    let selectedGroupTeachers = []; // 儲存已選的群組老師名單

    // 檢查瀏覽器是否已經有解鎖紀錄
    if (localStorage.getItem('erlingUnlocked') === 'true') {
      lockOverlay.style.display = 'none';
    }

    window.showLoginBox = function() {
      loginBox.classList.remove('hidden');
      passcodeInput.focus();
    };

    window.checkPasscode = function() {
      if (passcodeInput.value === PASSCODE) {
        localStorage.setItem('erlingUnlocked', 'true');
        lockOverlay.style.opacity = '0';
        setTimeout(() => { lockOverlay.style.display = 'none'; }, 500);
      } else {
        errorMsg.classList.remove('hidden');
        passcodeInput.value = '';
        passcodeInput.focus();
      }
    };

    passcodeInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') checkPasscode();
    });

    // 班級資料設定
    const classOptions = [
      '👑 一年級總表', '👑 二年級總表', '👑 三年級總表',
      '👑 四年級總表', '👑 五年級總表', '👑 六年級總表',
      '一年1班', '一年2班', '一年3班',
      '二年1班', '二年2班', '二年3班',
      '三年1班', '三年2班', '三年3班',
      '四年1班', '四年2班', '四年3班',
      '五年1班', '五年2班', '五年3班', '五年4班',
      '六年1班', '六年2班', '六年3班'
    ];

    // 科任教師資料設定
    const subjectTeachers = {
      '教務處': ['教務主任-楊淑雯', '教學組長-施雅芸', '註冊組長-林怡伶', '資訊執秘-陳宏漳'],
      '學務處': ['學務主任-謝宛娜', '生教體育-李宜昆', '訓育衛生-胡芝琳', '午餐執秘-邱子芸'],
      '總務處': ['總務主任-凃棟隆', '事務組長-邱文彥', '出納組長-沈金池'],
      '輔導室': ['輔導主任-陳振益', '輔導組長-周怡君'],
      '資源班': ['林婉茱', '蔡嘉楊', '李介麟', '陳美妗'],
      '純科任': ['陳韶絃', '李柏勳', '黃上乘', '葉玟孝', '吳建緯', '盧岱岑']
    };

    const timeSlots = [
      { name: '第一節', time: '08:30-09:10', isBreak: false, origIndex: 0 },
      { name: '第二節', time: '09:20-10:00', isBreak: false, origIndex: 1 },
      { name: '第三節', time: '10:30-11:10', isBreak: false, origIndex: 2 },
      { name: '第四節', time: '11:20-12:00', isBreak: false, origIndex: 3 },
      { name: '午餐午休', time: '12:00-13:35', isBreak: true, origIndex: 4 },
      { name: '第五節', time: '13:40-14:20', isBreak: false, origIndex: 5 },
      { name: '第六節', time: '14:30-15:10', isBreak: false, origIndex: 6 },
      { name: '第七節', time: '15:20-16:00', isBreak: false, origIndex: 7 },
    ];

    // 儲存各班級真實課表的資料庫
    const classSchedules = {
      '一年1班': {
        'MON': [ { s: '國語', t: '徐淑卿' }, { s: '數學', t: '徐淑卿' }, { s: '彈英', t: '盧岱岑' }, { s: '彈性', t: '徐淑卿' }, { s: '午休' }, { s: '', t: '' }, { s: '', t: '' }, { s: '', t: '' } ],

    // 自動計算班級導師
    function getHomeroomTeacher(className) {
      if (!classSchedules[className]) return '';
      const teacherCounts = {};
      let maxCount = 0;
      let hrTeacher = '';
      
      const schedule = classSchedules[className];
      for (const day in schedule) {
        schedule[day].forEach(item => {
          if (item && item.t) {
            teacherCounts[item.t] = (teacherCounts[item.t] || 0) + 1;
            if (teacherCounts[item.t] > maxCount) {
              maxCount = teacherCounts[item.t];
              hrTeacher = item.t;
            }
          }
        });
      }
      return hrTeacher;
    }

    // 取得指定老師在特定節次的活動 (用於群組比對)
    function getTeacherActivity(teacherName, dayKey, slotIndex) {
      // 先找資源班
      if (resourceSchedules[teacherName] && resourceSchedules[teacherName][dayKey] && resourceSchedules[teacherName][dayKey][slotIndex]) {
        const item = resourceSchedules[teacherName][dayKey][slotIndex];
        if (item.s || item.t) return { className: '資源班', subject: item.s || '特教' };
      }
      // 再找普通班
      for (const [className, schedule] of Object.entries(classSchedules)) {
        if (schedule[dayKey] && schedule[dayKey][slotIndex]) {
          const item = schedule[dayKey][slotIndex];
          if (item.t === teacherName) {
            return { className: className, subject: item.s };
          }
        }
      }
      return null; // 代表沒課
    }

      }

      const tableEl = document.querySelector('table');
      if (isResource) {
        if (currentTeacher === '李介麟') {
          tableEl.classList.add('resource-extended-table');
          tableEl.classList.remove('resource-table');
        } else {
          tableEl.classList.add('resource-table');
          tableEl.classList.remove('resource-extended-table');
        }
      } else {
        tableEl.classList.remove('resource-table');
        tableEl.classList.remove('resource-extended-table');
      }

      if (isResource) {
        activeTimeSlots.unshift({ name: '早自習', time: '07:50-08:30', isBreak: false, origIndex: -1 });

          activeTimeSlots.push({ name: '第八節', time: '16:05-16:45', isBreak: false, origIndex: 8 });

        if (slot.isBreak) {
          html += `<td colspan="5" class="lunch-break font-bold">午 🍽️ 餐 😴 午 💤 休</td>`;

                  teacherHtml = `<div class="text-[12px] min-[400px]:text-[13px] md:text-[20px] text-gray-500 whitespace-nowrap overflow-hidden text-ellipsis mt-0.5 rounded mx-1 pointer-events-none">${cellData.teacher}</div>`;
                } else {
                  teacherHtml = `<div onclick="goToClass('${cellData.teacher}')" class="text-[12px] min-[400px]:text-[13px] md:text-[20px] text-gray-500 whitespace-nowrap overflow-hidden text-ellipsis mt-0.5 cursor-pointer rounded mx-1">${cellData.teacher}</div>`;
                }
              }

              let subjectFontSize = "text-[15px] min-[400px]:text-[16px] md:text-[26px]";
              if (cellData.subject && cellData.subject.length >= 4) {
                subjectFontSize = "text-[11px] min-[375px]:text-[12px] min-[400px]:text-[13px] md:text-[22px]";
              }

              html += `<td class="${fadeClass}">
                         <div class="${subjectFontSize} font-bold text-gray-800 whitespace-nowrap overflow-hidden text-ellipsis">${cellData.subject}</div>
                         ${teacherHtml}
                       </td>`;
            } else {
              let emptyFadeClass = isFocusMode ? 'opacity-10 transition-opacity duration-500' : 'transition-opacity duration-500';
              html += `<td class="${emptyFadeClass}"></td>`;
            }
          }
        }
        html += `</tr>`;
      });
      scheduleBody.innerHTML = html;
    }

    // 事件監聽綁定
    roleSelect.addEventListener('change', (e) => {
      isFocusMode = false; 
      const val = e.target.value;
      
      classSelectWrapper.classList.add('hidden');
      deptSelectWrapper.classList.add('hidden');
      teacherSelectWrapper.classList.add('hidden');
      groupSelectWrapper.classList.add('hidden');

      if (val === '導師') {
        classSelectWrapper.classList.remove('hidden');
        classSelect.value = '👑 一年級總表';
      } else if (val === '科任') {
        deptSelectWrapper.classList.remove('hidden');
        teacherSelectWrapper.classList.remove('hidden');
        deptSelect.selectedIndex = 0;
        updateTeacherOptions(); 
      } else if (val === '群組') {
        groupSelectWrapper.classList.remove('hidden');
      }
      updateTitle();
    });

    classSelect.addEventListener('change', () => { isFocusMode = false; updateTitle(); });
    deptSelect.addEventListener('change', () => { isFocusMode = false; updateTeacherOptions(); updateTitle(); });
    teacherSelect.addEventListener('change', () => { isFocusMode = false; updateTitle(); });

    // 初始化下拉選單
    function initDropdowns() {
      classSelect.innerHTML = classOptions.map(cls => `<option value="${cls}">${cls}</option>`).join('');
      updateTeacherOptions();
      
      const savedFav = JSON.parse(localStorage.getItem('erlingFav') || 'null');
      if (savedFav && savedFav.role !== '群組') {
        roleSelect.value = savedFav.role;
        if (savedFav.role === '導師') {
          classSelectWrapper.classList.remove('hidden');
          deptSelectWrapper.classList.add('hidden');
          teacherSelectWrapper.classList.add('hidden');
          classSelect.value = savedFav.class;
        } else {
          classSelectWrapper.classList.add('hidden');
          deptSelectWrapper.classList.remove('hidden');
          teacherSelectWrapper.classList.remove('hidden');
          deptSelect.value = savedFav.dept;
          updateTeacherOptions(); 
          teacherSelect.value = savedFav.teacher;
        }
      }
      updateTitle();
    }
    initDropdowns();

    // ==========================================
    // 地圖彈出視窗功能 (相簿輪播模式)
    // ==========================================
    const mapModal = document.getElementById('mapModal');
    const mapImage = document.getElementById('mapImage');
    const mapPageNumber = document.getElementById('mapPageNumber');
    let currentMapIndex = 1;
    const totalMaps = 3;

    function updateMapDisplay() {
      mapImage.src = `map${currentMapIndex}.png`;
      mapImage.onerror = function() {
        this.onerror = null; 
        this.src = `https://placehold.co/800x600/eeeeee/999999?text=尚未上傳+map${currentMapIndex}.png`;
      };
      mapPageNumber.textContent = currentMapIndex;
    }

    window.nextMap = function(e) {
      if (e) e.stopPropagation(); 
      currentMapIndex = currentMapIndex >= totalMaps ? 1 : currentMapIndex + 1;
      updateMapDisplay();
    };

    window.prevMap = function(e) {
      if (e) e.stopPropagation(); 
      currentMapIndex = currentMapIndex <= 1 ? totalMaps : currentMapIndex - 1;
      updateMapDisplay();
    };

    window.showMap = function() {
      currentMapIndex = 1;
      updateMapDisplay();
      mapModal.classList.remove('hidden');
      setTimeout(() => {
        mapModal.classList.remove('opacity-0');
        mapModal.classList.add('opacity-100');
      }, 10);
    };

    window.hideMap = function() {
      mapModal.classList.remove('opacity-100');
      mapModal.classList.add('opacity-0');
      
      const viewportMeta = document.querySelector('meta[name="viewport"]');
      if (viewportMeta) {
        viewportMeta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
        setTimeout(() => {
          viewportMeta.content = 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes';
        }, 100);
      }
      setTimeout(() => { mapModal.classList.add('hidden'); }, 300);
    };

    // 快速跳轉功能
    window.goToClass = function(className) {
      if (!className || className === '') return;
      if (!className.includes('班')) return; 
      roleSelect.value = '導師';
      roleSelect.dispatchEvent(new Event('change'));
      classSelect.value = className;
      classSelect.dispatchEvent(new Event('change'));
    };

    window.goToTeacher = function(teacherName) {
      if (!teacherName || teacherName === '') return;
      for (const dept in subjectTeachers) {
        const foundTeacher = subjectTeachers[dept].find(t => t.includes(teacherName));
        if (foundTeacher) {
          roleSelect.value = '科任';
          roleSelect.dispatchEvent(new Event('change'));
          deptSelect.value = dept;
          deptSelect.dispatchEvent(new Event('change'));
          teacherSelect.value = foundTeacher;
          teacherSelect.dispatchEvent(new Event('change'));
          return;
        }
      }
    };

    // ==========================================
    // 自訂群組：彈出視窗與選擇邏輯 (超級過濾器)
    // ==========================================
    const groupModal = document.getElementById('groupModal');
    const groupTeacherList = document.getElementById('groupTeacherList');
    const groupCountText = document.getElementById('groupCountText');
    let tempSelected = []; 

    // 新增：帶有前綴與自訂排序的教師名單產生器
    function getAllTeachersWithFormat() {
      let list = [];
      const gradeMap = {'一':'1', '二':'2', '三':'3', '四':'4', '五':'5', '六':'6'};

      // 1. 導師 (自動轉換成 101, 102 格式)
      Object.keys(classSchedules).forEach(cls => {
        let t = getHomeroomTeacher(cls);
        if (t) {
          let match = cls.match(/(一|二|三|四|五|六)年(\d)班/);
          if (match) {
            let shortClass = gradeMap[match[1]] + '0' + match[2]; // 例如: '101'
            let weight = parseInt(shortClass); // 權重: 101 ~ 603
            list.push({ origName: t, formattedName: `${shortClass}${t}`, weight: weight });
          }
        }
      });

      // 2. 科任/行政 (精準擷取職稱前兩個字)
      const deptWeight = { '教務處': 1000, '學務處': 2000, '總務處': 3000, '輔導室': 4000, '資源班': 5000, '純科任': 6000 };

      Object.entries(subjectTeachers).forEach(([dept, tList]) => {
        tList.forEach((fullStr, index) => {
          let name = fullStr;
          let prefix = "";

          if (fullStr.includes('-')) {
            // 有帶職稱的，例如「教學組長-施雅芸」
            let parts = fullStr.split('-');
            name = parts[1];
            // 精準取職稱的前兩個字
            prefix = parts[0].substring(0, 2);
          } else {
            // 沒有帶職稱的 (如資源班、純科任)
            if (dept === '純科任') {
              prefix = '科任';
            } else if (dept === '資源班') {
              prefix = '資源';
            } else {
              prefix = dept.substring(0, 2);
            }
          }

          let formattedName = `${prefix}-${name}`;
          let weight = deptWeight[dept] + index;
          list.push({ origName: name, formattedName: formattedName, weight: weight });
        });
      });

      // 移除重複的人員並依照權重排序
      let uniqueMap = new Map();
      list.forEach(item => {
        if (!uniqueMap.has(item.origName)) {
          uniqueMap.set(item.origName, item);
        }
      });
      return Array.from(uniqueMap.values()).sort((a, b) => a.weight - b.weight);
    }

    window.showGroupModal = function() {
      tempSelected = [...selectedGroupTeachers];
      renderGroupCheckboxes();
      groupModal.classList.remove('hidden');
      setTimeout(() => { groupModal.classList.remove('opacity-0'); groupModal.classList.add('opacity-100'); }, 10);
    };

    window.hideGroupModal = function() {
      groupModal.classList.remove('opacity-100');
      groupModal.classList.add('opacity-0');
      setTimeout(() => { groupModal.classList.add('hidden'); }, 300);
    };

    function renderGroupCheckboxes() {
      // 專為手機版拉開間距防誤觸 (gap-4) 並加上外邊距 (p-2)，電腦版則強制維持第一版最美比例 (md:gap-3 md:p-1)
      groupTeacherList.className = 'flex-1 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 gap-4 md:gap-3 p-2 md:p-1';

      // 改用新的格式化名單產生器
      const formattedTeachers = getAllTeachersWithFormat();
      groupTeacherList.innerHTML = formattedTeachers.map(item => {
        let t = item.origName;
        let displayName = item.formattedName;
        let isChecked = tempSelected.includes(t);
        let disabled = !isChecked && tempSelected.length >= 4 ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer';
        let bgClass = isChecked ? 'bg-pink-100 border-pink-400' : 'bg-gray-50 border-gray-200';
        
        // 手機版：上下加高(py-4)增加點擊熱區。電腦版：維持第一版的 (md:p-3) 絕對不動！
        return `
          <label class="flex items-center gap-2 py-4 px-2 md:p-3 border-2 rounded-lg transition-colors ${bgClass} ${disabled} overflow-hidden w-full shadow-sm">
            <input type="checkbox" value="${t}" ${isChecked ? 'checked' : ''} onchange="toggleGroupTeacher(this)" class="shrink-0 w-4 h-4 md:w-5 md:h-5 text-pink-600 focus:ring-pink-500 rounded" ${!isChecked && tempSelected.length >= 4 ? 'disabled' : ''}>
            <span class="font-bold text-gray-700 text-[11px] min-[375px]:text-xs md:text-base tracking-tighter whitespace-nowrap w-full">${displayName}</span>
          </label>
        `;
      }).join('');
      groupCountText.textContent = `已選: ${tempSelected.length}/4`;
    }

    window.toggleGroupTeacher = function(checkbox) {
      if (checkbox.checked) {
        if (tempSelected.length < 4) tempSelected.push(checkbox.value);
        else checkbox.checked = false;
      } else {
        tempSelected = tempSelected.filter(t => t !== checkbox.value);
      }
      renderGroupCheckboxes(); 
    }

    window.confirmGroupSelection = function() {
      selectedGroupTeachers = [...tempSelected];
      groupSelectBtn.textContent = `➕ 挑選老師 (${selectedGroupTeachers.length}/4)`;
      hideGroupModal();
      updateTitle(); 
    }
  </script>
</body>
</html>
